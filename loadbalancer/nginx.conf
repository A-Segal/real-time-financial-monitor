# ---------------------------------------------------------------------------
# nginx load-balancer configuration — placeholder / template reference.
#
# This file exists as a fallback reference only.  The ACTUAL nginx config
# is generated at container startup by entrypoint.sh, which discovers
# backend replicas via Docker DNS and generates upstream blocks with
# one `server <ip>:8080` per unique IP.
#
# The generation logic produces the same structure as shown below.
#
# Generated upstream pools:
#   backend_api      — Round Robin (default) for /api/ routes
#   backend_signalr  — hash $cookie_signalr_id consistent for /hubs/ routes
#
# To see the live generated config inside a running container:
#   docker compose exec backend-lb cat /etc/nginx/conf.d/default.conf
#
# ---------------------------------------------------------------------------

upstream backend_api {
    # Dynamically generated — one server entry per unique backend IP.
}

upstream backend_signalr {
    hash $cookie_signalr_id consistent;
    # Dynamically generated — one server entry per unique backend IP.
}

server {
    listen 5000;
    server_name localhost;

    location /lb-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://backend_signalr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /health {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /sticky-test {
        proxy_pass http://backend_signalr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /lb-debug {
        proxy_pass http://backend_signalr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sticky-test {
        proxy_pass http://backend_signalr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
