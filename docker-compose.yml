services:
  redis:
    image: redis:7-alpine
    container_name: financial-monitor-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Shared SQLite volume, Redis backplane. Scale with --scale backend=N
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - Redis__ConnectionString=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - sqldata:/app/data

  # nginx reverse proxy with dynamic replica discovery and sticky-signalr routing
  backend-lb:
    build:
      context: loadbalancer
      dockerfile: Dockerfile
    container_name: financial-monitor-backend-lb
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    depends_on:
      - backend

  # nginx-served React SPA with runtime API URL injection (VITE_API_URL)
  frontend:
    build:
      context: client
    container_name: financial-monitor-frontend
    ports:
      - "127.0.0.1:5174:80"
    environment:
      VITE_API_URL: http://127.0.0.1:5000
    restart: unless-stopped

volumes:
  sqldata:
